[node]
# The container listens on all container interfaces.
# The loopback Compose publishes this on host loopback only.
# The public Caddy Compose does not publish GhostNode's port at all.
host = "0.0.0.0"
port = 8000
log_level = "warning"
access_log = false
database_path = "/data/messages.sqlite3"
relay_witness_path = "/data/relay-witness.sqlite3"

# Relay access token and relay-state coordination key are intentionally not stored
# in TOML. Their values are loaded from mounted secret files.
# relay_state_id is supplied through GHOSTLINK_RELAY_STATE_ID.

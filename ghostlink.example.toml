[node]
# Use 127.0.0.1 for local-only access.
# Use 0.0.0.0 only when the node must accept network connections.
host = "127.0.0.1"
port = 8000
log_level = "info"
access_log = true

# Optional persistent ciphertext store.
# Relative paths are resolved from the directory containing this config file.
database_path = "data/messages.sqlite3"

# Relay access token is intentionally not stored in TOML or as an env value.
# Set GHOSTLINK_NODE_TOKEN_FILE to the path of a private token file.


# Ratchet pre-key fetch anti-drain defaults.
# Limits count only new one-time allocations; idempotent retries do not consume quota.
prekey_fetch_window_seconds = 60
prekey_fetch_max_new_allocations = 10

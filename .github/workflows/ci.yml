name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy src

      - name: Tests
        run: poetry run pytest

  ratchet-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ratchet-engine/package-lock.json

      - name: Install pinned ratchet dependencies
        working-directory: ratchet-engine
        run: npm ci

      - name: Audit ratchet dependencies
        working-directory: ratchet-engine
        run: npm audit --audit-level=high

      - name: Build and test ratchet engine
        working-directory: ratchet-engine
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry for cross-language smoke
        run: pipx install poetry

      - name: Install Python dependencies for cross-language smoke
        run: poetry install --no-interaction

      - name: Run Python to libsignal RPC smoke test
        run: poetry run pytest tests/test_ratchet_engine_e2e.py

  container:
    runs-on: ubuntu-latest
    env:
      GHOSTLINK_NODE_TOKEN: ci-placeholder-token

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build GhostNode image
        run: docker compose build

      - name: Start GhostNode
        run: docker compose up -d --no-build

      - name: Wait for GhostNode health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs ghostnode
          exit 1

      - name: Verify unauthenticated relay access is rejected
        run: |
          DEVICE_ID="device1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}'             "http://127.0.0.1:8000/v2/messages/$DEVICE_ID")"
          test "$STATUS" = "401"

      - name: Verify authenticated relay access works
        run: |
          DEVICE_ID="device1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          RESPONSE="$(curl --fail --silent             --header "Authorization: Bearer $GHOSTLINK_NODE_TOKEN"             "http://127.0.0.1:8000/v2/messages/$DEVICE_ID")"
          test "$RESPONSE" = "[]"

      - name: Run protocol-v2 E2EE smoke test
        run: docker compose exec -T ghostnode ghostlink node-smoke --node http://127.0.0.1:8000

      - name: Show GhostNode status
        run: docker compose ps

      - name: Stop GhostNode
        if: always()
        run: docker compose down -v
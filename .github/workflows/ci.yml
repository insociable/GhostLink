name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Audit Python dependencies
        run: poetry run pip-audit

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy src

      - name: Tests
        run: poetry run pytest

  ratchet-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ratchet-engine/package-lock.json

      - name: Install pinned ratchet dependencies
        working-directory: ratchet-engine
        run: npm ci

      - name: Audit ratchet dependencies
        working-directory: ratchet-engine
        run: npm audit --audit-level=high

      - name: Build and test ratchet engine
        working-directory: ratchet-engine
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry for cross-language smoke
        run: pipx install poetry

      - name: Install Python dependencies for cross-language smoke
        run: poetry install --no-interaction

      - name: Run Python to libsignal RPC smoke test
        run: poetry run pytest tests/test_ratchet_engine_e2e.py

  container:
    runs-on: ubuntu-latest
    env:
      GHOSTLINK_NODE_TOKEN_FILE: /tmp/ghostlink-ci-secrets/ghostlink_node_token
      GHOSTLINK_RELAY_STATE_KEY_FILE: /tmp/ghostlink-ci-secrets/ghostlink_relay_state_key
      GHOSTLINK_RELAY_STATE_ID: 00112233445566778899aabbccddeeff
      GHOSTLINK_PUBLIC_HOSTNAME: node.example.com
      GHOSTLINK_ACME_EMAIL: admin@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Create relay secret files
        run: |
          umask 077
          mkdir -p "$(dirname "$GHOSTLINK_NODE_TOKEN_FILE")"
          chmod 700 "$(dirname "$GHOSTLINK_NODE_TOKEN_FILE")"
          printf '%s\n' 'ci-placeholder-token' > "$GHOSTLINK_NODE_TOKEN_FILE"
          printf '%s\n' '0101010101010101010101010101010101010101010101010101010101010101' > "$GHOSTLINK_RELAY_STATE_KEY_FILE"
          chmod 444 "$GHOSTLINK_NODE_TOKEN_FILE" "$GHOSTLINK_RELAY_STATE_KEY_FILE"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate public HTTPS Compose configuration
        run: |
          docker compose -f deploy/oracle/compose.public.yaml config --quiet
          docker compose -f deploy/oracle/compose.public.yaml config --format json > /tmp/ghostlink-public-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("/tmp/ghostlink-public-compose.json").read_text())
          services = document["services"]
          ghostnode_ports = services["ghostnode"].get("ports", [])
          assert ghostnode_ports == [], ghostnode_ports

          caddy_ports = services["caddy"].get("ports", [])
          assert len(caddy_ports) == 1, caddy_ports
          port = caddy_ports[0]
          assert int(port["target"]) == 443, port
          assert int(port["published"]) == 443, port
          assert port["protocol"] == "tcp", port
          PY

      - name: Validate Caddy TLS ingress configuration
        run: |
          docker run --rm \
            --env GHOSTLINK_PUBLIC_HOSTNAME \
            --env GHOSTLINK_ACME_EMAIL \
            --volume "$PWD/deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate external gate utility
        run: python deploy/oracle/validate_external.py --help > /dev/null

      - name: Build GhostNode image
        run: docker compose build

      - name: Initialize relay rollback state
        run: docker compose run --rm --no-deps ghostnode ghostnode --migrate-relay-state

      - name: Start GhostNode
        run: docker compose up -d --no-build

      - name: Wait for GhostNode health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs ghostnode
          exit 1

      - name: Verify retired static-v2 message relay is absent
        run: |
          DEVICE_ID="device1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:8000/v2/messages/$DEVICE_ID")"
          test "$STATUS" = "404"

      - name: Show GhostNode status
        run: docker compose ps

      - name: Stop GhostNode
        if: always()
        run: docker compose down -v
